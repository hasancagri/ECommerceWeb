# SPA serve — React Router istemci-taraflı; bilinmeyen yol → index.html (derin-link + F5 kalıcılığı).
# /api ve /files bu container'a GELMEZ (ingress path-split onları gateway'e yönlendirir); burada yalnız web.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # statik asset'ler uzun cache (hash'li dosya adları)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
