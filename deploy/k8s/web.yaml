# ECommerceWeb (nginx) — ns ecommerce (EC cluster'ıyla aynı). Ingress app host'un "/" yolu buna düşer
# (EC repo deploy/k8s/20-ingress.yaml). Image web repo CD'siyle GHCR'a basılır.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: ecommerce }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: web
          image: ghcr.io/hasancagri/ecommerce/web:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 80 } ]
          livenessProbe:  { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5,  periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: ecommerce }
spec: { selector: { app: web }, ports: [ { port: 80, targetPort: 80 } ] }
